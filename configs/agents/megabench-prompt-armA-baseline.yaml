# ARM A (baseline): stock pi system prompt + just-solve spec. No extensions. This is the historical config every SCB number so far ran on.
#
# NOTE: megabench's prompt_style:detailed is NOT applicable here -- it is task
# information (full statement vs 6-word truncation) and SCB already passes the
# full spec via just-solve.jinja. The treatment in arm B is NEW guidance text.
type: pi
binary: pi

version: 0.80.10
timeout: 14400
thinking: "off"
extra_args:
  - "--no-extensions"
env: {}
cost_limits:
  cost_limit: 0
  step_limit: 0
  net_cost_limit: 0
